[browser]
gatherUsageStats = false   # no data leaves this PC

[server]
headless = true
address = "localhost"     # dashboard only reachable from this PC; see README to view on a tablet
runOnSave = false
fileWatcherType = "none"   # avoid reloading modules (and rebinding the UDP port) mid-session
enableStaticServing = true  # bundled fonts in static/ (served at app/static/)

[client]
toolbarMode = "minimal"

# Broadcast-timing palette: graphite ground, tone-stepped surfaces, timing colours for timing only.
[theme]
base = "dark"
primaryColor = "#ECEEF2"   # controls in ink; purple is kept for F1's fastest-time colour only
backgroundColor = "#12141A"
secondaryBackgroundColor = "#1B1E26"
textColor = "#ECEEF2"
borderColor = "#2A2E38"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "0.2rem"
buttonRadius = "0.2rem"
font = "'Barlow Semi Condensed', 'Segoe UI', sans-serif"
headingFont = "'Barlow Semi Condensed', 'Segoe UI', sans-serif"
codeFont = "'Barlow Semi Condensed', 'Segoe UI', sans-serif"   # file paths in Diagnostics, in the text face
baseFontSize = 16
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#1B1E26"
dataframeBorderColor = "#2A2E38"
chartCategoricalColors = ["#ECEEF2", "#5CC8FF", "#F2C230", "#9CA3B0", "#FF4F4F", "#2BD47D"]

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-Regular.woff"
weight = 400

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-Medium.woff"
weight = 500

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-SemiBold.woff"
weight = 600

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-Bold.woff"
weight = 700

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-ExtraBoldItalic.woff"
weight = 800
style = "italic"

[theme.sidebar]
backgroundColor = "#171A21"
secondaryBackgroundColor = "#20242D"
