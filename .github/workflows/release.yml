name: release

# Push a tag such as v1.1.0: tests run, PurpleSector.exe is built and attached to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - run: python -m pytest -q
      - run: powershell -ExecutionPolicy Bypass -File scripts/build_exe.ps1
      # GitHub's own CLI, so no third-party action runs with write access to the repository
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/PurpleSector-windows.zip --title "PurpleSector $TAG" --generate-notes
